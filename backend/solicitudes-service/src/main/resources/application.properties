spring.application.name=solicitudes-service

server.port=8081

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mesatech}
spring.datasource.username=${DB_USERNAME:mesatech}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true